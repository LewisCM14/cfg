[project]
name = "cfgleaflet"
version = "0.1.0"
description = "Locate identifiers in CFG images and generate Leaflet-ready outputs."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "numpy>=2.3.0",
  "Pillow>=11.0.0",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfgleaflet"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
show_error_codes = true

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=cfgleaflet --cov-report=term-missing --cov-fail-under=100"

[project.scripts]
cfgleaflet = "cfgleaflet.cli:main"
